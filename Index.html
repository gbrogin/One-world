<!DOCTYPE html>
<html lang="it">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>ONE WORLD — Tabellone</title>
<link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
<style>
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

  html {
    background: #0a0e1a;
    position: fixed;
    width: 100%; height: 100%;
  }
  body {
    width: 100%; height: 100%;
    overflow: hidden;
    color: #e2e8f0;
    font-family: 'Share Tech Mono', 'Courier New', monospace;
    background:
      radial-gradient(ellipse at 20% 50%, #0d1f3c 0%, #0a0e1a 65%),
      radial-gradient(ellipse at 80% 20%, #1a0d2e 0%, #0a0e1a 55%),
      #0a0e1a;
    display: grid;
    grid-template-rows: auto 1fr 1fr auto;
  }

  /* ── HEADER ── */
  header { text-align: center; }
  .header-wrap {
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 2vw;
    padding: 0 1vw;
  }
  .sub {
    font-size: 1.2vh;
    letter-spacing: 0.5vw;
    color: #64748b;
    text-transform: uppercase;
  }
  h1 {
    font-family: 'Cinzel', Georgia, serif;
    font-size: 3.2vh;
    font-weight: 900;
    letter-spacing: 0.6vw;
    background: linear-gradient(135deg, #fbbf24, #f59e0b, #d97706);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    text-transform: uppercase;
    line-height: 1.2;
  }
  .divider {
    width: 10vw; height: 1px;
    background: linear-gradient(90deg, transparent, #fbbf24, transparent);
    margin: 0.3vh auto 0;
  }
  .btn-save, .btn-load {
    padding: 0.6vh 1.2vw;
    border-radius: 0.8vh;
    border: 1px solid;
    font-size: 1.4vh; font-weight: 700;
    letter-spacing: 0.1vw;
    text-transform: uppercase;
    cursor: pointer;
    font-family: 'Share Tech Mono', 'Courier New', monospace;
    transition: filter 0.2s, transform 0.1s;
    white-space: nowrap;
  }
  .btn-save { background: rgba(34,197,94,0.12); border-color: rgba(34,197,94,0.4); color: #22c55e; }
  .btn-load { background: rgba(96,165,250,0.12); border-color: rgba(96,165,250,0.4); color: #60a5fa; }
  .btn-save:active, .btn-load:active { transform: scale(0.94); filter: brightness(1.3); }

  /* ── RIGHE CORPORAZIONI ── */
  .corp-row {
    display: grid;
    grid-template-columns: repeat(3, 1fr);
    gap: 0.7vw;
    min-height: 0;
    padding: 0 1vw;
  }
  .corp-panel {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 1.2vh;
    padding: 0.8vh 1vw;
    position: relative; overflow: hidden;
    display: flex; flex-direction: column;
    gap: 0.2vh;
  }
  .corp-bg-num {
    position: absolute; top: -0.05em; right: 0.1em;
    font-family: 'Cinzel', Georgia, serif;
    font-size: 7.5vh; font-weight: 900;
    color: rgba(255,255,255,0.04);
    line-height: 1; user-select: none; pointer-events: none;
  }
  .corp-title {
    font-size: 4.8vh;
    letter-spacing: 0.2vw;
    color: #94a3b8;
    text-transform: uppercase;
    margin-bottom: 0.2vh;
    flex-shrink: 0;
  }
  .corp-title span { color: #fbbf24; font-weight: 700; }

  .voci-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 0.25vh 0.7vw;
    flex: 1; min-height: 0;
    align-content: space-evenly;
  }
  .voce-row { display: flex; align-items: center; gap: 0.35vw; }
  .voce-icon { font-size: 1.5vh; width: 2vw; text-align: center; flex-shrink: 0; }
  .voce-label {
    font-size: 1.2vh; text-transform: uppercase;
    flex: 1; min-width: 0; white-space: nowrap; overflow: hidden;
    color: #e2e8f0;
  }
  .voce-val {
    font-size: 2vh; font-weight: 700;
    width: 2.8vw; min-width: 28px;
    text-align: center; color: #f1f5f9; flex-shrink: 0;
    cursor: pointer;
    border-bottom: 1px dashed rgba(255,255,255,0.2);
  }
  .voce-val:focus { outline: none; border-bottom: 1px solid #fbbf24; color: #fbbf24; }

  .btn-sm {
    width: 3vh; height: 3vh;
    min-width: 32px; min-height: 32px;
    border-radius: 0.5vh; border: 1px solid;
    font-size: 2vh; font-weight: 700;
    cursor: pointer;
    display: flex; align-items: center; justify-content: center;
    flex-shrink: 0;
    transition: filter 0.15s, transform 0.1s;
    line-height: 1; background: transparent; padding: 0;
  }
  .btn-sm:active { transform: scale(0.88); filter: brightness(1.4); }
  .btn-minus { color: #ef4444; border-color: rgba(239,68,68,0.45); }
  .btn-plus  { color: #22c55e; border-color: rgba(34,197,94,0.45); }

  .btn-prod {
    margin-top: 0.3vh;
    width: 100%;
    padding: 1.8vh 0;
    background: rgba(192,132,252,0.15);
    border: 1px solid rgba(192,132,252,0.35);
    border-radius: 0.5vh;
    color: #c084fc;
    font-size: 2.8vh; font-weight: 700;
    letter-spacing: 0.1vw; text-transform: uppercase;
    cursor: pointer;
    font-family: 'Share Tech Mono', 'Courier New', monospace;
    transition: filter 0.15s, transform 0.1s;
    flex-shrink: 0;
  }
  .btn-prod:active { filter: brightness(1.4); transform: scale(0.97); }

  /* ── BARRA INFERIORE ── */
  .bottom-bar {
    display: grid;
    grid-template-columns: 1fr 1fr 1fr;
    gap: 0.7vw;
    min-height: 0;
    padding: 0 1vw 0.5vh;
  }
  .bottom-panel {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 1.2vh;
    padding: 0.7vh 1vw;
    display: flex; flex-direction: column;
    align-items: center; justify-content: center;
    gap: 0.5vh;
  }
  .panel-label {
    font-size: 1.1vh; letter-spacing: 0.25vw;
    text-transform: uppercase; color: #64748b;
  }

  /* Scarti */
  .scarti-row { display: flex; align-items: center; gap: 2vw; }
  .scarti-val {
    font-family: 'Cinzel', Georgia, serif;
    font-size: 4.5vh; font-weight: 900;
    color: #fbbf24; line-height: 1;
  }
  .btn-lg {
    width: 4.2vh; height: 4.2vh;
    min-width: 38px; min-height: 38px;
    border-radius: 0.7vh; border: 1px solid;
    font-size: 2.8vh; font-weight: 700;
    cursor: pointer; background: transparent;
    transition: filter 0.15s, transform 0.1s; line-height: 1;
  }
  .btn-lg:active { transform: scale(0.9); filter: brightness(1.4); }
  .btn-lg.minus { color: #ef4444; border-color: rgba(239,68,68,0.45); }
  .btn-lg.plus  { color: #22c55e; border-color: rgba(34,197,94,0.45); }

  /* Timer */
  .timer-wrap { display: flex; align-items: center; gap: 1.5vw; }
  .timer-circle {
    position: relative;
    width: 8.5vh; height: 8.5vh; flex-shrink: 0;
  }
  .timer-circle svg {
    position: absolute; top: 0; left: 0;
    width: 100%; height: 100%;
    transform: rotate(-90deg);
  }
  .timer-txt {
    position: absolute; inset: 0;
    display: flex; align-items: center; justify-content: center;
    font-size: 2vh; font-weight: 700; color: #94a3b8;
  }
  .btn-scambio {
    padding: 0.9vh 1.4vw;
    border: none; border-radius: 0.8vh;
    color: #fff; font-size: 1.4vh; font-weight: 700;
    letter-spacing: 1px; cursor: pointer;
    text-transform: uppercase;
    font-family: 'Share Tech Mono', 'Courier New', monospace;
    transition: filter 0.2s, transform 0.1s;
    white-space: nowrap; line-height: 1.5;
  }
  .btn-scambio:active { transform: scale(0.95); }

  /* Mazzo carte */
  .card-deck {
    width: 5.5vh; height: 8vh;
    border: 2px solid rgba(251,191,36,0.45);
    border-radius: 0.8vh;
    display: flex; align-items: center; justify-content: center;
    font-size: 3.2vh; cursor: pointer;
    transition: transform 0.2s, box-shadow 0.2s;
    box-shadow: 0 4px 16px rgba(251,191,36,0.12);
    background: linear-gradient(135deg, #1e293b, #0f172a);
    margin: 0 auto;
  }
  .card-deck:active { transform: scale(0.93); }
  .card-deck.flipping { transform: rotateY(90deg); }
  .hint { font-size: 1vh; color: #475569; letter-spacing: 1px; text-align: center; margin-top: 3px; }

  /* ── OVERLAY CARTA A SCHERMO INTERO ── */
  .card-overlay {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 999;
    background: rgba(7,9,15,0.92);
    align-items: center;
    justify-content: center;
    padding: 4vw;
  }
  .card-overlay.visible { display: flex; animation: fadeIn 0.3s ease; }
  .card-modal {
    background:
      radial-gradient(ellipse at 30% 30%, #1a2a4a 0%, #0a0e1a 70%),
      #0a0e1a;
    border: 2px solid rgba(251,191,36,0.4);
    border-radius: 3vh;
    padding: 5vh 5vw;
    max-width: 80vw; width: 100%;
    text-align: center;
    box-shadow: 0 0 60px rgba(251,191,36,0.15);
    animation: cardPop 0.35s cubic-bezier(0.34,1.56,0.64,1);
  }
  .card-modal-emoji { font-size: 8vh; line-height: 1; margin-bottom: 2vh; }
  .card-modal-titolo {
    font-family: 'Cinzel', Georgia, serif;
    font-size: 5vh; font-weight: 900;
    letter-spacing: 0.3vw;
    background: linear-gradient(135deg, #fbbf24, #f59e0b, #d97706);
    -webkit-background-clip: text; -webkit-text-fill-color: transparent;
    background-clip: text;
    text-transform: uppercase;
    margin-bottom: 3vh;
  }
  .card-modal-testo {
    color: #e2e8f0; font-size: 2.8vh; line-height: 1.7; margin-bottom: 4vh;
  }
  .card-modal-close {
    padding: 1.5vh 4vw;
    background: linear-gradient(135deg, #1e3a5f, #3b82f6);
    border: none; border-radius: 1vh;
    color: #fff; font-size: 2vh; font-weight: 700;
    letter-spacing: 0.2vw; text-transform: uppercase;
    cursor: pointer;
    font-family: 'Share Tech Mono', 'Courier New', monospace;
    transition: filter 0.2s, transform 0.1s;
  }
  .card-modal-close:active { transform: scale(0.95); filter: brightness(1.2); }

  /* ── TOAST ── */
  .toast {
    position: fixed;
    bottom: 3vh; left: 50%;
    transform: translateX(-50%) translateY(10px);
    background: rgba(15,23,42,0.95);
    border: 1px solid rgba(255,255,255,0.15);
    border-radius: 1vh;
    padding: 1.2vh 2.5vw;
    font-size: 1.6vh; color: #e2e8f0;
    opacity: 0;
    transition: opacity 0.3s, transform 0.3s;
    z-index: 1000;
    pointer-events: none;
    white-space: nowrap;
  }
  .toast.show { opacity: 1; transform: translateX(-50%) translateY(0); }

  @keyframes fadeIn { from { opacity:0; } to { opacity:1; } }
  @keyframes cardPop {
    from { opacity:0; transform: scale(0.85); }
    to   { opacity:1; transform: scale(1); }
  }
</style>
</head>
<body>

<header>
  <div class="header-wrap">
    <button class="btn-save" onclick="salvaPartita()">💾 Salva</button>
    <div>
      <div class="sub">Sistema di controllo</div>
      <h1>ONE WORLD</h1>
    </div>
    <button class="btn-load" onclick="caricaPartita()">📂 Carica</button>
  </div>
  <div class="divider"></div>
</header>

<div class="corp-row" id="row-top"></div>
<div class="corp-row" id="row-mid"></div>

<div class="bottom-bar">

  <div class="bottom-panel">
    <div class="panel-label">🌍 Scarti Globali</div>
    <div class="scarti-row">
      <button class="btn-lg minus" onclick="cambiaScarto(-1)">−</button>
      <span class="scarti-val" id="scarti-val">0</span>
      <button class="btn-lg plus" onclick="cambiaScarto(1)">+</button>
    </div>
  </div>

  <div class="bottom-panel">
    <div class="panel-label">⏱ Fase Scambio</div>
    <div class="timer-wrap">
      <div class="timer-circle">
        <svg viewBox="0 0 64 64">
          <circle cx="32" cy="32" r="27" fill="none" stroke="rgba(255,255,255,0.06)" stroke-width="5"/>
          <circle id="timer-arc" cx="32" cy="32" r="27" fill="none"
            stroke="#334155" stroke-width="5"
            stroke-dasharray="169.6" stroke-dashoffset="0"
            stroke-linecap="round"
            style="transition:stroke-dashoffset 1s linear,stroke 0.3s"/>
        </svg>
        <div class="timer-txt" id="timer-txt">3:00</div>
      </div>
      <button class="btn-scambio" id="btn-scambio"
        style="background:linear-gradient(135deg,#1e3a5f,#3b82f6)"
        onclick="toggleTimer()">🔄 Avvia<br>Scambio</button>
    </div>
  </div>

  <div class="bottom-panel">
    <div class="panel-label">🃏 Carte Evento</div>
    <div class="card-deck" id="card-deck" onclick="pescaCarta()">🃏</div>
    <div class="hint">tocca per pescare</div>
  </div>

</div>

<!-- Overlay carta a schermo intero -->
<div class="card-overlay" id="card-overlay" onclick="chiudiOverlay()">
  <div class="card-modal" onclick="event.stopPropagation()">
    <div class="card-modal-emoji" id="overlay-emoji"></div>
    <div class="card-modal-titolo" id="overlay-titolo"></div>
    <div class="card-modal-testo" id="overlay-testo"></div>
    <button class="card-modal-close" onclick="chiudiOverlay()">✕ Chiudi</button>
  </div>
</div>

<!-- Toast -->
<div class="toast" id="toast"></div>

<script>
// ── FIX VIEWPORT iOS ──────────────────────────────────────────────
function fixHeight() {
  document.body.style.height = window.innerHeight + 'px';
  document.documentElement.style.height = window.innerHeight + 'px';
}
fixHeight();
window.addEventListener('resize', fixHeight);
window.addEventListener('orientationchange', () => setTimeout(fixHeight, 300));

// ── DATI ──────────────────────────────────────────────────────────
const VOCI   = ['cibo','materie','energie','salute','sapere','beni'];
const ICONS  = {cibo:'🌾',materie:'⛏️',energie:'⚡',salute:'❤️',sapere:'📚',beni:'💎'};
const COLORS = {cibo:'#4ade80',materie:'#fb923c',energie:'#facc15',salute:'#f87171',sapere:'#60a5fa',beni:'#c084fc'};

const CARTE = [
  {id:1,  emoji:'🌊', titolo:'ALLUVIONE',
   testo:'Le corporazioni con meno di 4 gettoni SALUTE e meno di 4 gettoni SAPERE perdono 1 gettone MATERIE PRIME e 1 gettone CIBO.'},
  {id:2,  emoji:'🦠', titolo:'PANDEMIA',
   testo:'Tutte le corporazioni perdono 1 gettone SALUTE.'},
  {id:3,  emoji:'📈', titolo:'BOOM ECONOMICO',
   testo:'Le corporazioni con più di 6 gettoni ENERGIA producono il doppio dei BENI in questo turno.'},
  {id:4,  emoji:'🔬', titolo:'SCOPERTA TECNOLOGICA',
   testo:'Le corporazioni con più di 4 gettoni SAPERE guadagnano 1 gettone ENERGIA. Le corporazioni con più di 7 gettoni SAPERE guadagnano 1 gettone ENERGIA e 1 gettone SALUTE.'},
  {id:5,  emoji:'⚔️', titolo:'GUERRA',
   testo:'Le corporazioni che non hanno almeno 7 gettoni ENERGIA, 7 gettoni SALUTE e 7 gettoni SAPERE perdono 1 gettone per ogni risorsa mancante.'},
  {id:6,  emoji:'🕊️', titolo:'ACCORDO O.N.U.',
   testo:'Tutte le corporazioni devono donare almeno 1 gettone ad un\'altra corporazione.'},
  {id:7,  emoji:'☢️', titolo:'RIFIUTI TOSSICI',
   testo:'Ogni corporazione con 7 gettoni ENERGIA raddoppia i propri gettoni CIBO per questo turno, ma deve scegliere due altre corporazioni cui viene tolto 1 gettone SALUTE.'},
  {id:8,  emoji:'🌿', titolo:'ACCORDO SUL CLIMA',
   testo:'Se ogni corporazione con almeno 6 gettoni ENERGIA, 6 gettoni CIBO e 6 gettoni SAPERE dona 2 gettoni risorsa alle altre, tutti i gettoni SCARTO vengono eliminati.'},
  {id:9,  emoji:'🎓', titolo:'RETE EDUCATIVA GLOBALE',
   testo:'Le corporazioni con almeno 5 gettoni SAPERE possono donare 1 gettone SAPERE alle corporazioni che ne hanno di meno, per guadagnare 1 gettone ENERGIA.'},
  {id:10, emoji:'🌻', titolo:'RACCOLTO ECCEZIONALE',
   testo:'Tutte le corporazioni con meno di 4 gettoni CIBO guadagnano 1 gettone CIBO. Tutte le corporazioni con meno di 4 gettoni MATERIE PRIME guadagnano 1 gettone MATERIE PRIME.'},
  {id:11, emoji:'✊', titolo:'IMPEGNO DEI GIOVANI',
   testo:'Le corporazioni con almeno 6 gettoni SAPERE donano almeno 1 gettone CIBO o 1 gettone SALUTE alle due corporazioni più povere.'},
  {id:12, emoji:'🌡️', titolo:'CRISI CLIMATICA',
   testo:'Le corporazioni con meno di 7 gettoni ENERGIA e meno di 7 gettoni SAPERE perdono 1 gettone CIBO e 1 gettone MATERIE PRIME.'},
];

// ── STATO ─────────────────────────────────────────────────────────
const stato = {};
[1,2,3,4,5,6].forEach(n => { stato[n]={}; VOCI.forEach(v => stato[n][v]=0); });
let scartiGlobali=0, timerActive=false, secondi=180, timerInterval=null;
let ultimeCarte=[], flipping=false;

// ── CORPORAZIONI ──────────────────────────────────────────────────
function buildCorp(n) {
  const p = document.createElement('div');
  p.className = 'corp-panel';
  p.innerHTML = `
    <div class="corp-bg-num">${n}</div>
    <div class="corp-title">Corporazione <span>${n}</span></div>
    <div class="voci-grid" id="vg-${n}"></div>
    <button class="btn-prod" onclick="produci(${n})">⚙️ Produci beni</button>`;
  document.getElementById(n<=3?'row-top':'row-mid').appendChild(p);
  const vg = document.getElementById(`vg-${n}`);
  VOCI.forEach(v => {
    const r = document.createElement('div');
    r.className = 'voce-row';
    r.innerHTML = `
      <span class="voce-icon">${ICONS[v]}</span>
      <span class="voce-label" style="color:${COLORS[v]}">${v}</span>
      <button class="btn-sm btn-minus" onclick="cambia(${n},'${v}',-1)">−</button>
      <span class="voce-val" id="val-${n}-${v}"
        contenteditable="true" inputmode="numeric"
        onblur="setDiretto(${n},'${v}',this)"
        onkeydown="if(event.key==='Enter'){this.blur();}">0</span>
      <button class="btn-sm btn-plus" onclick="cambia(${n},'${v}',1)">+</button>`;
    vg.appendChild(r);
  });
}
[1,2,3,4,5,6].forEach(buildCorp);

// ── LOGICA VALORI ─────────────────────────────────────────────────
function aggiorna(corp, voce) {
  document.getElementById(`val-${corp}-${voce}`).textContent = stato[corp][voce];
}
function cambia(corp, voce, delta) {
  stato[corp][voce] = Math.max(0, stato[corp][voce] + delta);
  aggiorna(corp, voce);
}
function setDiretto(corp, voce, el) {
  const v = parseInt(el.textContent.trim(), 10);
  stato[corp][voce] = isNaN(v) || v < 0 ? 0 : v;
  el.textContent = stato[corp][voce];
}
function produci(corp) {
  const prod = Math.min(stato[corp]['energie'], stato[corp]['materie']) + Math.floor(stato[corp]['cibo'] / 2);
  stato[corp]['beni'] += prod;
  aggiorna(corp, 'beni');
  const btn = document.querySelector(`#vg-${corp}`).nextElementSibling;
  const orig = btn.innerHTML;
  btn.innerHTML = `✅ +${prod} beni`;
  btn.style.color = '#4ade80';
  btn.style.borderColor = 'rgba(74,222,128,0.4)';
  setTimeout(() => { btn.innerHTML = orig; btn.style.color=''; btn.style.borderColor=''; }, 1800);
}
function cambiaScarto(delta) {
  scartiGlobali = Math.max(0, scartiGlobali + delta);
  document.getElementById('scarti-val').textContent = scartiGlobali;
}

// ── TIMER ─────────────────────────────────────────────────────────
function toggleTimer() {
  const btn = document.getElementById('btn-scambio');
  if (timerActive) {
    clearInterval(timerInterval); timerActive=false; secondi=180; aggiornaTimer();
    btn.innerHTML='🔄 Avvia<br>Scambio';
    btn.style.background='linear-gradient(135deg,#1e3a5f,#3b82f6)';
  } else {
    secondi=180; timerActive=true; timerInterval=setInterval(tickTimer,1000);
    btn.innerHTML='⏹ Ferma';
    btn.style.background='linear-gradient(135deg,#7f1d1d,#ef4444)';
  }
}
function tickTimer() {
  secondi--; aggiornaTimer();
  if (secondi<=0) {
    clearInterval(timerInterval); timerActive=false;
    const btn=document.getElementById('btn-scambio');
    btn.innerHTML='🔄 Avvia<br>Scambio';
    btn.style.background='linear-gradient(135deg,#1e3a5f,#3b82f6)';
  }
}
function aggiornaTimer() {
  const arc=document.getElementById('timer-arc'), txt=document.getElementById('timer-txt');
  arc.style.strokeDashoffset=(2*Math.PI*27)*(1-secondi/180);
  if (secondi<=0) {
    arc.style.stroke='#ef4444'; txt.style.color='#ef4444'; txt.textContent='FINE';
  } else {
    arc.style.stroke=timerActive?'#fbbf24':'#334155';
    txt.style.color =timerActive?'#fbbf24':'#94a3b8';
    txt.textContent=`${Math.floor(secondi/60)}:${(secondi%60).toString().padStart(2,'0')}`;
  }
}

// ── CARTE ─────────────────────────────────────────────────────────
function pescaCarta() {
  if (flipping) return; flipping=true;
  const deck=document.getElementById('card-deck');
  deck.classList.add('flipping');
  setTimeout(()=>{
    let c,t=0;
    do { c=CARTE[Math.floor(Math.random()*12)]; t++; } while(ultimeCarte.includes(c.id)&&t<20);
    ultimeCarte=[c.id,...ultimeCarte].slice(0,5);
    document.getElementById('overlay-emoji').textContent=c.emoji;
    document.getElementById('overlay-titolo').textContent=c.titolo;
    document.getElementById('overlay-testo').textContent=c.testo;
    document.getElementById('card-overlay').classList.add('visible');
    deck.classList.remove('flipping');
  },300);
}
function chiudiOverlay() {
  document.getElementById('card-overlay').classList.remove('visible');
  flipping=false;
}

// ── SALVA / CARICA ────────────────────────────────────────────────
function mostraToast(msg, colore) {
  const t=document.getElementById('toast');
  t.textContent=msg;
  t.style.color=colore||'#e2e8f0';
  t.classList.add('show');
  setTimeout(()=>t.classList.remove('show'),2500);
}
function salvaPartita() {
  const dati={ stato, scartiGlobali, timestamp: new Date().toLocaleString('it-IT') };
  try {
    localStorage.setItem('oneworld_save', JSON.stringify(dati));
    mostraToast('💾 Salvato — '+dati.timestamp, '#22c55e');
  } catch(e) { mostraToast('⚠️ Errore nel salvataggio','#ef4444'); }
}
function caricaPartita() {
  try {
    const raw=localStorage.getItem('oneworld_save');
    if (!raw) { mostraToast('⚠️ Nessuna partita salvata','#f59e0b'); return; }
    const dati=JSON.parse(raw);
    [1,2,3,4,5,6].forEach(n=>{
      VOCI.forEach(v=>{ stato[n][v]=dati.stato[n][v]||0; aggiorna(n,v); });
    });
    scartiGlobali=dati.scartiGlobali||0;
    document.getElementById('scarti-val').textContent=scartiGlobali;
    mostraToast('📂 Caricato — '+(dati.timestamp||''),'#60a5fa');
  } catch(e) { mostraToast('⚠️ Errore nel caricamento','#ef4444'); }
}
</script>
